name: Publish resume PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.8"

      - name: Render PDF
        run: rendercv render samuel-mohr-resume.yaml

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete resume-pdf --yes --cleanup-tag || true
          gh release create resume-pdf rendercv_output/samuel-mohr-resume.pdf \
            --title "Resume PDF" \
            --notes "Auto-generated from samuel-mohr-resume.yaml on $(date -u +%F)" \
            --latest

      # Redeploy personal-site so the new PDF is served at sammohr.dev.
      # Requires SITE_DEPLOY_TOKEN (fine-grained PAT, Actions write on
      # smores56/personal-site) — see personal-site README for setup/rotation.
      - name: Trigger personal-site deployment
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run deploy-to-gh-pages.yml -R smores56/personal-site --ref main
          else
            echo "::error::SITE_DEPLOY_TOKEN secret is not set; personal-site will not redeploy"
            exit 1
          fi
